name: Automated NPM Security Audit & Auto-Fix

on:
  schedule:
    # Run every Sunday at 02:00 UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  audit-and-fix:
    name: Audit, Test & Auto-Merge Security Fixes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Frontend - Audit & Fix
        working-directory: ./frontend
        run: |
          npm install --legacy-peer-deps
          npm audit fix --legacy-peer-deps || true

      - name: Backend - Audit & Fix
        working-directory: ./backend
        run: |
          npm install --legacy-peer-deps
          npm audit fix --legacy-peer-deps || true

      - name: Verify Frontend Build & Test
        working-directory: ./frontend
        run: |
          npm run lint
          npm run build
          npm run test

      - name: Verify Backend Build & Test
        working-directory: ./backend
        run: |
          npm run db:generate
          npm run build
          npm run test -- src/controllers src/services src/__tests__/security.test.ts

      - name: Check for Changes
        id: git_status
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Create & Auto-Merge Pull Request
        if: steps.git_status.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME="security/auto-fix-$(date +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH_NAME"
          git add .
          git commit -m "fix(security): automated npm audit fix"
          git push origin "$BRANCH_NAME"

          PR_URL=$(gh pr create \
            --title "security: Automated NPM Vulnerability Fix" \
            --body "Automated dependency security fixes applied by security-audit workflow. All builds, lints, and tests passed cleanly." \
            --head "$BRANCH_NAME" \
            --base main)

          gh pr review --approve "$PR_URL" || true
          gh pr merge "$PR_URL" --auto --squash --delete-branch || gh pr merge "$PR_URL" --squash --delete-branch
